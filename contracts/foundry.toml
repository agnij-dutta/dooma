[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# 0G Galileo testnet (chain id 16602). Deploy is out of scope for the MVP
# (no funds) — kept here for when the 3 OG funding wall clears.
[rpc_endpoints]
og_testnet = "https://evmrpc-testnet.0g.ai"
